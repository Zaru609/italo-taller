const GUARDADO = "taller-italo-codigo";
const de64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function abrir(codigo) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(codigo), "PBKDF2", false, ["deriveKey"]);
  const clave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: de64(PAQUETE.sal), iterations: PAQUETE.it, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: de64(PAQUETE.iv) }, clave, de64(PAQUETE.datos)));
  // Se monta dentro de esta misma página para no perder las etiquetas de «Añadir a pantalla de inicio»
  const doc = new DOMParser().parseFromString(html, "text/html");
  document.getElementById("estilo-entrada").remove();
  for (const s of doc.head.querySelectorAll("style")) document.head.append(s);
  const scripts = [...doc.body.querySelectorAll("script")];
  scripts.forEach(s => s.remove());
  document.body.replaceChildren(...doc.body.childNodes);
  for (const s of scripts) { const n = document.createElement("script"); n.textContent = s.textContent; document.body.append(n); }
}

async function probar(codigo, guardar) {
  try {
    await abrir(codigo);
    if (guardar) try { localStorage.setItem(GUARDADO, codigo); } catch {}
    return true;
  } catch { return false; }
}

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const b = document.getElementById("entrar"), err = document.getElementById("error");
  b.disabled = true; err.textContent = "";
  const ok = await probar(document.getElementById("codigo").value.trim().toLowerCase(), true);
  if (!ok) { b.disabled = false; err.textContent = "Código incorrecto"; }
});

(async () => {
  let previo = null;
  try { previo = localStorage.getItem(GUARDADO); } catch {}
  if (previo && !(await probar(previo, false))) try { localStorage.removeItem(GUARDADO); } catch {}
})();
</script>
